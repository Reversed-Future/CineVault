name: cine_vault
description: A modern Flutter video player for personal movie libraries.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.1
  google_fonts: ^6.1.0
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  window_manager: ^0.3.8
  file_picker: ^6.1.1
  http: ^1.1.2
  cached_network_image: ^3.3.1
  dio: ^5.4.0
  path: ^1.8.3
  crypto: ^3.0.3
  crop_your_image: ^1.0.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
